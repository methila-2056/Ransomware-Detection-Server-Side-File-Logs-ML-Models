[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    error::RuntimeWarning
    # xgboost 2.1.3 still declares _more_tags/_get_tags while scikit-learn 1.6
    # prefers __sklearn_tags__. assrd/compat.py repairs the behaviour; the
    # upstream DeprecationWarning it triggers is expected and not actionable
    # from this project, so it is filtered rather than left to bury real output.
    ignore:The XGBClassifier or classes from which it inherits use:DeprecationWarning